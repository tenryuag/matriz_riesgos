# Configuración mínima del proyecto para la CLI de Supabase.
# Solo se usa para desplegar Edge Functions (`npx supabase functions deploy`).
# Las opciones de Auth (OAuth 2.1, ruta de consentimiento, Site URL) se
# configuran desde el panel de Supabase; NO corras `supabase config push`
# con este archivo, porque sobreescribiría la configuración de Auth.

project_id = "hcmeoducjqudokfhhvyc"

[functions.mcp]
# El servidor MCP verifica el token OAuth por sí mismo (withSupabase) y debe
# poder responder 401 con el descubrimiento OAuth a peticiones sin token.
verify_jwt = false

[functions.ia]
# Asistente de IA de la app. Verifica el JWT del usuario por sí misma (igual
# que `mcp`) y responde el preflight CORS sin token.
verify_jwt = false

# ── Base local de pruebas (`supabase start`) ────────────────────────────────
# Puertos propios (5434x) para no chocar con otros proyectos locales.
# Cómo levantarla y cargarle la copia de producción: docs/BD-LOCAL.md
[api]
port = 54341

[db]
port = 54342
shadow_port = 54340
major_version = 17

[studio]
port = 54343

[local_smtp]
port = 54344

[analytics]
enabled = false

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]

[auth.email]
enable_confirmations = false
